name: Oredy SPA Loader Build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or tag to build
        required: false
        default: "main"
      base_path:
        description: Public base path, e.g. /app/my-spa/
        required: false
        default: /
  repository_dispatch:
    types: [spa-loader-pro-build]
  push:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref || github.event.client_payload.branch || github.ref_name }}
      - name: Detect package manager & lockfile
        id: pm
        shell: bash
        run: |
          if [ -f bun.lockb ] || [ -f bun.lock ]; then echo "pm=bun" >> "$GITHUB_OUTPUT";
          elif [ -f pnpm-lock.yaml ]; then echo "pm=pnpm" >> "$GITHUB_OUTPUT";
          elif [ -f yarn.lock ]; then echo "pm=yarn" >> "$GITHUB_OUTPUT";
          else echo "pm=npm" >> "$GITHUB_OUTPUT"; fi
      - uses: oven-sh/setup-bun@v2
        if: steps.pm.outputs.pm == 'bun'
      - uses: pnpm/action-setup@v4
        if: steps.pm.outputs.pm == 'pnpm'
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        shell: bash
        env:
          SPA_LOADER_WORKFLOW_VERSION: "5"
          CI: "true"
          HUSKY: "0"
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            bun) bun install --frozen-lockfile || bun install ;;
            pnpm) pnpm install --frozen-lockfile || pnpm install ;;
            yarn) yarn install --frozen-lockfile || yarn install ;;
            *) npm config set legacy-peer-deps true; npm ci || npm install ;;
          esac
      - name: Build SPA
        shell: bash
        env:
          CI: "true"
          NODE_ENV: production
          SPA_LOADER_BASE_PATH: ${{ github.event.inputs.base_path || github.event.client_payload.base_path || '/' }}
          VITE_BASE_PATH: ${{ github.event.inputs.base_path || github.event.client_payload.base_path || '/' }}
          BASE_URL: ${{ github.event.inputs.base_path || github.event.client_payload.base_path || '/' }}
          PUBLIC_URL: ${{ github.event.inputs.base_path || github.event.client_payload.base_path || '/' }}
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            bun) bun run build ;;
            pnpm) pnpm run build ;;
            yarn) yarn build ;;
            *) npm run build ;;
          esac
      - name: Locate build output
        shell: bash
        run: |
          is_build_dir() {
            local dir="$1"
            [ -f "$dir/index.html" ] || return 1
            if [ -d "$dir/src" ] && grep -Eiq '(/src/|\./src/|/@vite/client|main\.(jsx|tsx))' "$dir/index.html"; then return 1; fi
            grep -Eiq '(src|href)=.*\.(js|mjs|css)' "$dir/index.html" || return 1
            find "$dir" -maxdepth 8 -type f \( -iname '*.js' -o -iname '*.mjs' -o -iname '*.css' \) -print -quit | grep -q .
          }
          for dir in dist build out public www _site .output/public .next/standalone client/build client/dist frontend/dist frontend/build app/dist app/build apps/web/dist apps/web/build packages/web/dist packages/web/build; do
            if is_build_dir "$dir"; then echo "BUILD_DIR=$dir" >> "$GITHUB_ENV"; exit 0; fi
          done
          while IFS= read -r index; do
            dir="${index%/index.html}"
            [ "$dir" = "$index" ] && continue
            if is_build_dir "$dir"; then echo "BUILD_DIR=$dir" >> "$GITHUB_ENV"; exit 0; fi
          done < <(find . -type d \( -name .git -o -name node_modules \) -prune -o -type f -name index.html -print)
          echo "::error::No build output with index.html found"
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: spa-loader-pro-build-${{ github.run_id }}
          path: ${{ env.BUILD_DIR }}
          if-no-files-found: error
          retention-days: 1